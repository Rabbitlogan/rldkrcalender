<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rld.kr 캘린더</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calendar-app">
    <header class="calendar-header">
      <div class="header-left">
        <button type="button" id="menuToggle" class="menu-btn" aria-label="메뉴" aria-expanded="false">
          <span class="menu-icon"></span>
        </button>
        <div class="brand">
          <span class="brand-text">rld.kr 캘린더</span>
        </div>
      </div>
      <div class="header-center">
        <button type="button" id="prevMonth" class="nav-btn" aria-label="이전 달">‹</button>
        <h2 id="monthYear" class="month-title"></h2>
        <button type="button" id="nextMonth" class="nav-btn" aria-label="다음 달">›</button>
      </div>
      <div class="header-right">
        <button type="button" id="todayBtn" class="today-btn" aria-label="오늘로 이동">오늘</button>
        <button type="button" id="darkModeToggle" class="icon-btn" aria-label="다크모드 토글" title="다크모드">
          <span class="icon-sun" aria-hidden="true">☀️</span>
          <span class="icon-moon" aria-hidden="true">🌙</span>
        </button>
      </div>
    </header>

    <section class="weekday-row" aria-label="요일">
      <div class="weekday">일</div>
      <div class="weekday">월</div>
      <div class="weekday">화</div>
      <div class="weekday">수</div>
      <div class="weekday">목</div>
      <div class="weekday">금</div>
      <div class="weekday">토</div>
    </section>

    <section class="days-grid" id="daysGrid" aria-label="날짜"></section>

    <section class="note-panel" aria-label="선택한 날짜 메모">
      <h3 id="selectedDateLabel">날짜를 선택하세요</h3>
      <textarea id="noteInput" placeholder="메모를 입력하세요" aria-label="메모 입력"></textarea>
      <div class="note-actions">
        <button type="button" id="saveNote" class="primary-btn">저장</button>
        <button type="button" id="clearNote" class="secondary-btn">삭제</button>
      </div>
    </section>

    <!-- 메뉴 패널 (드롭다운) -->
    <div id="menuPanel" class="menu-panel" role="menu" aria-label="메뉴" hidden>
      <div class="menu-item" role="menuitem" data-action="today">
        <span class="menu-icon-text">📅</span> 오늘로 이동
      </div>
      <div class="menu-item" role="menuitem" data-action="export">
        <span class="menu-icon-text">📤</span> 메모 내보내기 (JSON)
      </div>
      <div class="menu-item" role="menuitem" data-action="import">
        <span class="menu-icon-text">📥</span> 메모 가져오기 (JSON)
      </div>
      <div class="menu-divider"></div>
      <div class="menu-item" role="menuitem" data-action="clearAll">
        <span class="menu-icon-text">🗑️</span> 전체 메모 삭제
      </div>
      <div class="menu-item" role="menuitem" data-action="darkMode">
        <span class="menu-icon-text">🎨</span> 다크모드 토글
      </div>
    </div>

    <!-- 파일 입력 (숨김) -->
    <input type="file" id="importFileInput" accept=".json" hidden aria-label="메모 가져오기 파일 선택">

    <!-- 내보내기 링크 (숨김) -->
    <a id="exportLink" hidden></a>
  </div>

  <script src="app.js"></script>
</body>
</html>
